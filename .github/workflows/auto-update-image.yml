name: Auto-update easyengine-docker
permissions:
  contents: write
  actions: read

on:
  schedule:
    - cron: '30 21 * * *' # Chạy định kỳ lúc 3:00 AM giờ Ấn Độ (IST) mỗi ngày
  workflow_dispatch:      # Cho phép bấm nút chạy thủ công để test

jobs:
  automation-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Orchestrator (Docker Repo)
        uses: actions/checkout@v4
        with:
          path: main-docker

      # 1. KIỂM TRA PHIÊN BẢN MỚI TỪ EASYENGINE GỐC (NHÁNH DEVELOP)
      - name: Check for New Version
        id: check_version
        run: |
          # Lấy version từ dự án gốc EasyEngine
          REMOTE=$(curl -s https://raw.githubusercontent.com/EasyEngine/easyengine/develop/VERSION | xargs)
          # Lấy version hiện tại trong repo docker của bạn
          LOCAL=$(cat main-docker/VERSION | xargs)
          
          if [ "$REMOTE" = "$LOCAL" ]; then
            echo "Version is up to date ($REMOTE). Skipping..."
            echo "run=false" >> $GITHUB_OUTPUT
          else
            echo "New version detected: $REMOTE"
            echo "run=true" >> $GITHUB_OUTPUT
            echo "ver=$REMOTE" >> $GITHUB_OUTPUT
            echo "old_ver=$LOCAL" >> $GITHUB_OUTPUT
          fi

      - name: Setup Git Config
        if: steps.check_version.outputs.run == 'true'
        run: |
          git config --global user.name "EE-Update-Bot"
          git config --global user.email "bot@github.com"

      # 2. XỬ LÝ SITE-COMMAND (PATCH HÀM TỪ FILE TEMPLATE .TXT)
      - name: Sync & Patch Site-Command
        if: steps.check_version.outputs.run == 'true'
        run: |
          # 1. Clone repo fork của bạn về máy ảo
          git clone https://x-access-token:${{ secrets.EE_DOCKER_AUTO_UPDATE_TOKEN }}@github.com/dinhngocdung/site-command.git sc
          cd sc
          
          # 2. Thêm remote upstream chỉ đến EasyEngine gốc
          git remote add upstream https://github.com/EasyEngine/site-command.git
          git fetch upstream
          
          # 3. Đồng bộ hoàn toàn đưa local về trạng thái giống hệt master của repo gốc
          git reset --hard upstream/master
          
          # 4. Tạo và chuyển sang nhánh mới ee-docker-custom từ master sạch này
          git checkout -b ee-docker-custom

          # 5. Dùng PHP để patch: đọc nội dung từ templates/site-utils-patch.txt
          php -r '
            $file = "src/helper/site-utils.php";
            $content = file_get_contents($file);
            $patch = file_get_contents("../main-docker/templates/site-utils-patch.txt");

            // 1. Tìm vị trí bắt đầu của hàm cần thay thế
            $functionName = "function remove_etc_hosts_entry";
            $startPos = strpos($content, $functionName);
            if ($startPos === false) { echo "Error: Function not found.\n"; exit(1); }

            // 2. Tìm ngược lên trên để lấy phần DocBlock (ghi chú /**)
            $docBlockPos = strrpos(substr($content, 0, $startPos), "/**");

            // 3. Tìm dấu đóng ngoặc nhọn "}" cuối cùng của hàm đó
            $endPos = strpos($content, "}", $startPos) + 1;

            // 4. Thực hiện thay thế đoạn từ $docBlockPos đến $endPos
            $before = substr($content, 0, $docBlockPos);
            $after = substr($content, $endPos);
            $updated = $before . $patch . $after;

            file_put_contents($file, $updated);
            echo "Patch applied precisely.\n";
          '

          # 6. Commit và Force Push nhánh custom này lên repo fork của bạn
          git add .
          git commit -m "Auto-patch v${{ steps.check_version.outputs.ver }}: Docker compatibility [skip ci]"
          git push origin ee-docker-custom --force

      # 3. XỬ LÝ EASYENGINE (ĐỒNG BỘ MASTER GỐC, BUILD PHAR & ĐỢI KẾT QUẢ)
      - name: Sync & Patch EasyEngine
        if: steps.check_version.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.EE_DOCKER_AUTO_UPDATE_TOKEN }}
        run: |
          set -euo pipefail

          # 1. Clone repo fork easyengine của bạn về máy ảo
          git clone https://x-access-token:${GH_TOKEN}@github.com/dinhngocdung/easyengine.git ee
          cd ee
          
          # 2. Đồng bộ sạch từ nhánh master của EasyEngine gốc
          git remote add upstream https://github.com/EasyEngine/easyengine.git
          git fetch upstream
          git reset --hard upstream/master

          # 3. Dọn dẹp file test_and_build.yml gốc (chứa khóa owner) để tránh xung đột
          if [ -f ".github/workflows/test_and_build.yml" ]; then
            rm .github/workflows/test_and_build.yml
            echo "Deleted old test_and_build.yml"
          fi
          
          # 4. Chép file cấu hình build .phar custom của bạn vào
          mkdir -p .github/workflows
          cp ../main-docker/templates/build.yml .github/workflows/build.yml
          
          # 5. Patch file composer.json bằng jq để chỉ định dùng site-command (nhánh ee-docker-custom)
          jq -s '.[0] * .[1]' composer.json ../main-docker/templates/composer-patch.json > tmp.json && mv tmp.json composer.json
          
          # 6. Cấu hình định danh Git & thực hiện ép push đè lên master của bạn
          git config --local user.email "action@github.com"
          git config --local user.name "EE-Update-Bot"
          git add .
          git commit -m "Auto-sync v${{ steps.check_version.outputs.ver }}: Apply custom build config on master [skip ci]" || echo "No changes"
          git push origin master --force
          
          # 7. LOGIC CŨ: Kích hoạt API và Đợi build PHAR tại repo easyengine xong mới đi tiếp
          OWNER="dinhngocdung"
          REPO="easyengine"
          WORKFLOW_FILE="build.yml"
          REF="master"  # ĐÃ ĐỔI TỪ develop SANG master ĐỂ ĐỒNG BỘ
          API="https://api.github.com"
          TOKEN="$GH_TOKEN"

          start_time=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "Dispatching workflow $WORKFLOW_FILE on $OWNER/$REPO@$REF (start_time=$start_time)..."

          # Trigger workflow_dispatch qua API
          curl -s -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API/repos/$OWNER/$REPO/actions/workflows/$WORKFLOW_FILE/dispatches" \
            -d "{\"ref\":\"$REF\"}"

          echo "Waiting for a workflow run to be created..."
          # Vòng lặp tìm kiếm ID của run mới vừa được sinh ra
          run_id=""
          for i in {1..60}; do
            sleep 10
            runs_json=$(curl -s -H "Authorization: token $TOKEN" -H "Accept: application/vnd.github+json" \
              "$API/repos/$OWNER/$REPO/actions/runs?event=workflow_dispatch&per_page=50")
            run_id=$(echo "$runs_json" | jq -r --arg ref "$REF" --arg start "$start_time" \
              '.workflow_runs[] | select(.head_branch == $ref and .created_at > $start) | .id' | head -n1)

            if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
              echo "Found run id: $run_id"
              break
            fi
            echo "No run yet, retrying... ($i)"
          done

          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "Timed out waiting for workflow run to be created."
            exit 1
          fi

          # Vòng lặp liên tục kiểm tra trạng thái (Polling) cho đến khi build xong hoàn toàn
          echo "Polling run $run_id status..."
          while true; do
            sleep 10
            run_info=$(curl -s -H "Authorization: token $TOKEN" -H "Accept: application/vnd.github+json" \
              "$API/repos/$OWNER/$REPO/actions/runs/$run_id")
            status=$(echo "$run_info" | jq -r .status)
            conclusion=$(echo "$run_info" | jq -r .conclusion)
            echo "Status: $status, Conclusion: $conclusion"

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "Workflow completed successfully."
                break
              else
                echo "Workflow completed with conclusion: $conclusion"
                exit 1
              fi
            fi
          done

      # 4. ĐỒNG BỘ VERSION TỪ GỐC VÀ TRIGGER MULTI-REGISTRY PUBLISH
      - name: Finalize & Trigger Consolidated Docker Build
        if: steps.check_version.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.EE_DOCKER_AUTO_UPDATE_TOKEN }}
        run: |
          set -euo pipefail

          cd main-docker
          
          # LƯU VERSION CŨ TRƯỚC KHI CẬP NHẬT
          OLD_VERSION="${{ steps.check_version.outputs.old_ver }}"
          echo "Saved old version: $OLD_VERSION"
          
          # Đồng bộ VERSION trực tiếp từ repo EasyEngine gốc
          curl -s https://raw.githubusercontent.com/EasyEngine/easyengine/develop/VERSION -o VERSION
          NEW_VERSION=$(cat VERSION | xargs)
          echo "New version fetched: $NEW_VERSION"
          
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          
          # Hàm helper dispatch_and_wait
          dispatch_and_wait() {
            OWNER="$1"; REPO="$2"; WORKFLOW_FILE="$3"; REF="$4"; TOKEN="$5"; API="https://api.github.com"
            start_time=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            
            echo "Triggering $WORKFLOW_FILE on $OWNER/$REPO@$REF..."
            curl -s -X POST -H "Authorization: token $TOKEN" -H "Accept: application/vnd.github+json" \
              "$API/repos/$OWNER/$REPO/actions/workflows/$WORKFLOW_FILE/dispatches" -d "{\"ref\":\"$REF\"}"
            
            run_id=""
            for i in {1..90}; do
              sleep 10
              run_id=$(curl -s -H "Authorization: token $TOKEN" "$API/repos/$OWNER/$REPO/actions/workflows/$WORKFLOW_FILE/runs?per_page=5" | \
                jq -r --arg ref "$REF" --arg start "$start_time" '.workflow_runs[] | select(.head_branch == $ref and .created_at > $start) | .id' | head -n1)
              [ -n "$run_id" ] && [ "$run_id" != "null" ] && break
            done

            if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
              echo "Error: Failed to find workflow run"
              return 1
            fi

            echo "Found run: $run_id"
            while true; do
              sleep 15
              info=$(curl -s -H "Authorization: token $TOKEN" "$API/repos/$OWNER/$REPO/actions/runs/$run_id")
              status=$(echo "$info" | jq -r .status)
              conclusion=$(echo "$info" | jq -r .conclusion)
              echo "Status: $status, Conclusion: $conclusion"
              
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "Workflow completed successfully"
                  return 0
                else
                  echo "Workflow failed with conclusion: $conclusion"
                  return 1
                fi
              fi
            done
          }

          # CẬP NHẬT VERSION TRONG GIT
          git add VERSION
          git commit -m "Bump version to $NEW_VERSION [skip ci]" || echo "No change in VERSION"
          git push origin main
          
          # Gọi duy nhất workflow tổng hợp publish-docker.yml
          echo "Triggering consolidated publish workflow..."
          if dispatch_and_wait "dinhngocdung" "easyengine-docker" "publish-docker.yml" "main" "${GH_TOKEN}"; then
            echo "✓ All registries updated via publish-docker.yml"
          else
            echo "✗ Docker build failed. Reverting VERSION to $OLD_VERSION..."
            echo "$OLD_VERSION" > VERSION
            git add VERSION
            git commit -m "Revert version to $OLD_VERSION - build failed [skip ci]"
            git push origin main
            echo "VERSION has been reverted to $OLD_VERSION"
            exit 1
          fi
